<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YONITÉ — בקרוב</title>
<meta name="description" content="YONITÉ — טיפוח עור פרימיום, האיזון המושלם לעור שלך. בקרוב.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,500&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ec;
    --ink: #2b2b28;
    --ink-soft: #5c5a54;
    --accent: #7a8b6f;
    --accent-dark: #62705a;
    --line: rgba(43, 43, 40, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Heebo', 'Segoe UI', Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .card {
    width: 100%;
    max-width: 520px;
    text-align: center;
  }
  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(48px, 10vw, 72px);
    letter-spacing: 1px;
    color: var(--ink);
    margin: 0;
    line-height: 1;
    direction: ltr;
  }
  .subline {
    margin: 14px 0 0;
    font-size: 15px;
    color: var(--ink-soft);
    letter-spacing: 0.2px;
  }
  .divider {
    width: 56px;
    height: 1px;
    background: var(--line);
    margin: 34px auto;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    color: var(--accent-dark);
    margin: 0 0 16px;
  }
  .copy {
    font-size: 15.5px;
    line-height: 1.8;
    color: var(--ink-soft);
    margin: 0 0 32px;
  }
  form {
    display: flex;
    gap: 10px;
    max-width: 400px;
    margin: 0 auto;
  }
  input[type="email"] {
    flex: 1;
    min-width: 0;
    padding: 13px 16px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    direction: ltr;
    text-align: right;
  }
  input[type="email"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    padding: 13px 22px;
    border: none;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    font-family: 'Heebo', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: default; }

  .msg {
    margin-top: 16px;
    font-size: 13.5px;
    min-height: 18px;
  }
  .msg.success { color: var(--accent-dark); }
  .msg.error { color: #a3453a; }

  @media (max-width: 420px) {
    form { flex-direction: column; }
    button { width: 100%; }
  }

  footer {
    margin-top: 48px;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="wordmark">Yonité</p>
    <p class="subline">האיזון המושלם לעור שלך.</p>

    <div class="divider"></div>

    <p class="eyebrow">בקרוב</p>
    <p class="copy">
      אנחנו מלטשים את הפרטים האחרונים של YONITÉ — טיפוח עור ברמה מקצועית,
      מופק ממרכיבים איכותיים ומובחרים. השאירי את כתובת המייל שלך
      ונעדכן אותך ברגע שנעלה לאוויר.
    </p>

    <form id="notify-form" action="https://formspree.io/f/mrpbgqza" method="POST">
      <input type="email" name="email" placeholder="your@email.com" required aria-label="כתובת אימייל">
      <button type="submit">עדכנו אותי</button>
    </form>
    <p id="form-msg" class="msg" role="status"></p>

    <footer>&copy; <span id="year"></span> YONITÉ</footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const form = document.getElementById('notify-form');
    const msg = document.getElementById('form-msg');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = form.querySelector('button');
      const data = new FormData(form);

      btn.disabled = true;
      btn.textContent = 'שולח…';
      msg.textContent = '';
      msg.className = 'msg';

      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (res.ok) {
          form.reset();
          form.style.display = 'none';
          msg.textContent = 'תודה — נהיה בקשר ברגע שנעלה לאוויר.';
          msg.classList.add('success');
        } else {
          throw new Error('Request failed');
        }
      } catch (err) {
        msg.textContent = 'משהו השתבש — נסי שוב בעוד רגע.';
        msg.classList.add('error');
        btn.disabled = false;
        btn.textContent = 'עדכנו אותי';
      }
    });
  </script>
</body>
</html>
